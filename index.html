<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140f33">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="STEFY Dalszövegek – offline digitális zenész-könyv dalszövegekhez és fellépésekhez.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>STEFY Dalszövegek</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar">
      <button id="backBtn" class="back-btn" type="button" aria-label="Vissza"></button>
      <h1 id="viewTitle" class="view-title"></h1>
      <div id="clock" class="clock" data-clock role="timer" aria-label="Pontos idő"></div>
      <div id="saveInd" class="save-ind" title="Minden adat helyben, ezen az eszközön mentve" role="status"><i></i><span>Helyben mentve</span></div>
      <div id="lockBadge" class="lock-badge-slot"></div>
      <div id="viewActions" class="view-actions"></div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="bottomnav" class="bottomnav" aria-label="Fő navigáció"></nav>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>Az alkalmazás használatához engedélyezd a JavaScriptet.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
